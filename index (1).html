<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>連絡先を追加</title>
<style>
  :root{
    --ink:#141821;
    --ink-60:#5b6472;
    --paper:#f6f6f3;
    --card:#ffffff;
    --rule:#e4e4df;
    --accent:#1f6f4a;
    --accent-dark:#175537;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",
                "Noto Sans JP","Yu Gothic",sans-serif;
    line-height:1.7;
    -webkit-text-size-adjust:100%;
    display:flex;
    justify-content:center;
    padding:34px 20px 60px;
  }
  main{width:100%;max-width:400px}

  .eyebrow{
    margin:0 0 14px;
    font-size:11px;
    letter-spacing:.2em;
    color:var(--ink-60);
  }

  /* 名刺を模したカード：左辺のアクセント罫がこのページの目印 */
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--accent);
    border-radius:2px;
    padding:22px 22px 20px;
  }
  .org{
    margin:0;
    font-size:12px;
    color:var(--ink-60);
    min-height:1.7em;
  }
  .name{
    margin:2px 0 0;
    font-size:21px;
    font-weight:600;
    letter-spacing:.02em;
    min-height:1.4em;
  }
  .card hr{
    border:0;
    border-top:1px solid var(--rule);
    margin:16px 0 14px;
  }
  .tel-label{
    margin:0;
    font-size:10px;
    letter-spacing:.16em;
    color:var(--ink-60);
  }
  .tel{
    margin:2px 0 0;
    font-size:23px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:.03em;
    min-height:1.4em;
  }

  .status{
    margin:14px 0 0;
    font-size:12px;
    color:var(--ink-60);
  }

  .btn{
    display:block;
    margin:22px 0 0;
    padding:16px 20px;
    background:var(--accent);
    color:#fff;
    font-size:17px;
    font-weight:600;
    text-align:center;
    text-decoration:none;
    border-radius:2px;
  }
  .btn:active{background:var(--accent-dark)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .alt{margin:14px 0 0;text-align:center;font-size:13px}
  .alt a{color:var(--accent)}

  .note{
    margin:30px 0 0;
    padding-top:16px;
    border-top:1px solid var(--rule);
    font-size:12px;
    line-height:1.9;
    color:var(--ink-60);
  }
  .note b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>

  <p class="eyebrow">CONTACT</p>

  <section class="card">
    <p class="org"  id="org"></p>
    <p class="name" id="name">読み込み中...</p>
    <hr>
    <p class="tel-label">TEL</p>
    <p class="tel"  id="tel">&nbsp;</p>
  </section>

  <p class="status" id="status"></p>

  <!--
    ボタンの href は同じ場所に置いた contact.vcf を指しています。
    番号を変えたいときは contact.vcf だけを書き換えてください。
    このHTMLを編集する必要はありません。
    （JavaScript が動かない環境でも、このボタンだけは必ず機能します）
  -->
  <a class="btn" id="vcf" href="contact.vcf">連絡先に追加</a>

  <p class="alt" id="alt" hidden>
    <a id="altlink" href="#">追加画面が開かないときはこちら</a>
  </p>

  <p class="note">
    <b>iPhone</b>：ボタンを押すと連絡先の追加画面が開きます。<br>
    <b>Android</b>：連絡先アプリの新規登録画面が開くので、最後に保存を押してください。<br>
    QRコードアプリ内のブラウザではうまく動かないことがあります。その場合は Chrome や Safari で開いてください。
  </p>

</main>

<script>
(function () {
  var vcfBtn   = document.getElementById('vcf');
  var elName   = document.getElementById('name');
  var elOrg    = document.getElementById('org');
  var elTel    = document.getElementById('tel');
  var elStatus = document.getElementById('status');
  var elAlt    = document.getElementById('alt');
  var elAltLnk = document.getElementById('altlink');

  // ボタンの href から vCard の場所を取り出す（編集箇所を1か所にするため）
  var vcfUrl = vcfBtn.getAttribute('href');

  var isAndroid = /android/i.test(navigator.userAgent);
  var loaded = false;

  /** vCardから氏名・電話・メール・会社名を抽出 */
  function parseVCard(text) {
    var c = { name: '', phone: '', email: '', company: '' };
    var nFallback = '';

    text.split(/\r\n|\r|\n/).forEach(function (line) {
      var i = line.indexOf(':');
      if (i < 0) return;

      // "item1.TEL;type=CELL" のような形式も拾えるよう正規化
      var key  = line.substring(0, i).toUpperCase().replace(/^ITEM\d+\./, '');
      var name = key.split(';')[0];          // パラメータ部を落とす
      var val  = line.substring(i + 1).trim();
      if (!val) return;

      if (name === 'FN')                       c.name = val;
      else if (name === 'N' && !nFallback)     nFallback = val;
      else if (name === 'TEL' && !c.phone)     c.phone = val;
      else if (name === 'EMAIL' && !c.email)   c.email = val;
      else if (name === 'ORG')                 c.company = val;
    });

    // FN が無い場合は N（姓;名;…）から組み立てる
    if (!c.name && nFallback) {
      c.name = nFallback.split(';').filter(String).join(' ').trim();
    }
    if (c.company) {
      c.company = c.company.split(';').filter(String).join(' ').trim();
    }
    return c;
  }

  // Android 連絡先追加インテントを組み立てる
  function buildIntent(c) {
    var p = [
      'intent:#Intent',
      'action=android.intent.action.INSERT',
      'type=vnd.android.cursor.item/contact'
    ];
    if (c.name)    p.push('S.name='    + encodeURIComponent(c.name));
    if (c.phone)   p.push('S.phone='   + encodeURIComponent(c.phone));
    if (c.email)   p.push('S.email='   + encodeURIComponent(c.email));
    if (c.company) p.push('S.company=' + encodeURIComponent(c.company));
    p.push('S.browser_fallback_url=' + encodeURIComponent(
      new URL(vcfUrl, location.href).href));
    p.push('end');
    return p.join(';');
  }

  function render(c) {
    if (loaded) return;
    loaded = true;
    c = c || {};

    elName.textContent   = c.name || '連絡先';
    elOrg.textContent    = c.company || '';
    elTel.textContent    = c.phone || '';
    elStatus.textContent = '';

    if (isAndroid) {
      // Android のみ、ボタンの遷移先をインテントに差し替える
      vcfBtn.setAttribute('href', buildIntent(c));
      elAltLnk.setAttribute('href', vcfUrl);
      elAlt.hidden = false;
    }
  }

  function fail() {
    if (loaded) return;
    loaded = true;
    elName.textContent = '連絡先';
    elTel.textContent  = '';
    elStatus.textContent =
      '連絡先情報を読み込めませんでした。下のボタンから追加できます。';
  }

  // キャッシュを避けるためタイムスタンプを付けて取得
  var src = vcfUrl + (vcfUrl.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();

  if (window.fetch) {
    fetch(src, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.text(); })
      .then(function (t) { render(parseVCard(t)); })
      .catch(fail);
  } else {
    // 古いブラウザ向けフォールバック
    var x = new XMLHttpRequest();
    x.open('GET', src, true);
    x.onload  = function () {
      if (x.status >= 200 && x.status < 300) render(parseVCard(x.responseText));
      else fail();
    };
    x.onerror = fail;
    x.send();
  }

  setTimeout(fail, 10000);
})();
</script>
</body>
</html>
